name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # site/ 里改了东西当然要重建
      - 'site/**'
      # 站点正文由仓库 markdown 生成，所以这些源文件改了也要重建
      - 'agent-sandbox-tutorial/**'
      - 'agent-sandbox-lab/**'
      - 'ai-agent-sandbox.md'
      - 'README.md'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Sync docs from repo markdown
        working-directory: site
        run: python3 scripts/sync-docs.py
      - name: Build
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
